name: CI/CD

on:
  push:
    branches: [main]
    # 文書だけの変更では、ビルドも配信もしない。PR の CI は絞らない（Dependabot の PR は CI の合格がマージの条件）
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'issues/**'
      - 'context/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # main では deploy ジョブが build するので、PR のときだけ走らせる
      - if: github.event_name == 'pull_request'
        run: npm run build
        env:
          CF_REMOTE_BINDINGS: 'false'

  deploy:
    needs: test
    # workflow_dispatch は任意の ref から手動で走らせられるため、event_name でも判定する
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # build 中に KV の remote バインディング解決で Cloudflare 接続が必要なため、
      # deploy だけでなく build にも認証情報を渡す
      - run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
